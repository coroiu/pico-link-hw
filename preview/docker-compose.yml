services:
  preview:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Bind on all interfaces, not just localhost, so it's reachable from
      # other devices (e.g. a phone) on the same LAN. 8788, not the more
      # obvious 8787, because something else on this machine already uses
      # 8787.
      - "0.0.0.0:8788:8787"
    volumes:
      - ../hardware:/work/hardware:ro
      - ../enclosure:/work/enclosure:ro
      # Only read for the source commit shown in the Files section (a file,
      # not a dir, in a git worktree: the commit then shows as "unknown").
      - ../.git:/work/gitdir:ro
      # Board's 3D models, synced from the host's KiCad library by
      # scripts/sync-3dmodels.sh (run it first; re-run after adding parts).
      - ./.3dmodels:/kicad-3dmodels:ro
    environment:
      # The board's model paths use ${KICAD8_3DMODEL_DIR}; set the newer names
      # too so footprints re-saved by KiCad 9/10 also resolve.
      - KICAD8_3DMODEL_DIR=/kicad-3dmodels
      - KICAD9_3DMODEL_DIR=/kicad-3dmodels
      - KICAD10_3DMODEL_DIR=/kicad-3dmodels
    restart: unless-stopped
